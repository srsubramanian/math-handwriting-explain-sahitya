<title>Sharing to Divide 5-7</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Patrick+Hand&display=swap">
<style>
/* Layout: a dry-erase board that a marker writes on, one step at a time. Problem chips above,
   a sticky dock below with the step's explanation and the Back / Play / Next buttons. */
:root {
  --desk: #e3e8e4;
  --board: #fdfdfb;
  --frame: #c3cbc6;
  --ink: #23272e;
  --blue: #1f55c9;
  --red: #c9352b;
  --green: #1d7f43;
  --muted: #5d6963;
  --btn-fg: #ffffff;
  --title: "Gochi Hand", "Patrick Hand", "Comic Sans MS", cursive;
  --hand: "Patrick Hand", "Comic Sans MS", "Segoe Print", cursive;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --desk: #121815; --board: #1f2a26; --frame: #4a5750; --ink: #f0eee4;
    --blue: #8fc7ff; --red: #ff9c8c; --green: #9be28f; --muted: #a5b5ad; --btn-fg: #10201a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --desk: #121815; --board: #1f2a26; --frame: #4a5750; --ink: #f0eee4;
  --blue: #8fc7ff; --red: #ff9c8c; --green: #9be28f; --muted: #a5b5ad; --btn-fg: #10201a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--desk);
  color: var(--ink);
  font-family: var(--hand);
  font-size: 20px;
  line-height: 1.3;
  padding-block: 16px 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main { max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
header { display: flex; flex-direction: column; }
.eyebrow { color: var(--muted); font-size: 16px; letter-spacing: .06em; text-transform: uppercase; }
h1 { font-family: var(--title); font-weight: 400; font-size: clamp(26px, 6.5vw, 36px); margin: 0; line-height: 1.1; }

.lessons { display: flex; flex-wrap: wrap; gap: 8px; }
.lesson {
  font: inherit; font-size: 20px; cursor: pointer; flex: 1 1 200px;
  padding: 8px 14px; min-height: 46px; border-radius: 10px; text-align: left;
  border: 2px solid var(--frame); background: transparent; color: var(--ink);
}
.lesson[aria-current="true"] { background: var(--board); border-color: var(--ink); box-shadow: inset 0 -4px 0 var(--red); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  font: inherit; font-size: 19px; cursor: pointer;
  padding: 4px 12px; min-height: 40px; border-radius: 999px;
  border: 2px solid var(--frame); background: var(--board); color: var(--ink);
}
.chip[aria-current="true"] { background: var(--blue); border-color: var(--blue); color: var(--btn-fg); }
.chip.done::after { content: " ✓"; color: var(--green); }
.chip.done[aria-current="true"]::after { color: var(--btn-fg); }

.board {
  background: var(--board);
  border: 8px solid var(--frame);
  border-radius: 10px;
  box-shadow: 0 8px 24px rgb(0 0 0 / .14);
}
.board svg { display: block; width: 100%; height: auto; user-select: none; -webkit-user-select: none; }
.tray { display: flex; gap: 8px; justify-content: flex-end; padding: 6px 14px; border-top: 3px solid var(--frame); }
.tray i { width: 34px; height: 7px; border-radius: 4px; }
.t { font-family: var(--hand); }
.s { fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; }
.t.ink { fill: var(--ink); } .t.blue { fill: var(--blue); } .t.red { fill: var(--red); } .t.green { fill: var(--green); }
.s.ink { stroke: var(--ink); } .s.blue { stroke: var(--blue); } .s.red { stroke: var(--red); } .s.green { stroke: var(--green); }
.bg-ink { background: var(--ink); } .bg-blue { background: var(--blue); } .bg-red { background: var(--red); } .bg-green { background: var(--green); }
#pen .body { fill: var(--muted); stroke: var(--board); stroke-width: 1.5; }
#pen .tip.ink { fill: var(--ink); } #pen .tip.blue { fill: var(--blue); } #pen .tip.red { fill: var(--red); } #pen .tip.green { fill: var(--green); }

.dock {
  position: sticky; bottom: 0; z-index: 5;
  background: var(--desk);
  border-top: 2px solid var(--frame);
  padding: 10px 0 calc(12px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 8px;
}
.count { color: var(--muted); font-size: 17px; }
.say { margin: 0; font-size: clamp(20px, 5vw, 23px); min-height: 3.9em; max-width: 62ch; }
.note { display: block; color: var(--red); }
.note.good { color: var(--green); }
.btns { display: flex; gap: 8px; }
.btn {
  font: inherit; font-size: 21px; cursor: pointer;
  padding: 8px 16px; min-height: 48px; border-radius: 999px;
  border: 2px solid var(--ink); background: var(--board); color: var(--ink);
}
.btn.go { background: var(--blue); border-color: var(--blue); color: var(--btn-fg); flex: 1 1 auto; }
.btn:disabled { opacity: .35; cursor: default; }
.btn:focus-visible, .chip:focus-visible, .lesson:focus-visible { outline: 3px solid var(--red); outline-offset: 2px; }
</style>

<main>
  <header>
    <span class="eyebrow" id="eyebrow">Additional Practice 5-7</span>
    <h1 id="lessonName">Sharing to Divide</h1>
  </header>

  <nav class="lessons" id="lessons" aria-label="Pick a worksheet"></nav>

  <nav class="chips" id="chips" aria-label="Pick a problem"></nav>

  <div class="board">
    <svg id="board" viewBox="0 0 800 640" role="img" aria-label="Whiteboard"></svg>
    <div class="tray" aria-hidden="true"><i class="bg-ink"></i><i class="bg-blue"></i><i class="bg-red"></i><i class="bg-green"></i></div>
  </div>

  <div class="dock">
    <span class="count" id="count"></span>
    <p class="say" aria-live="polite"><span id="say"></span> <span class="note" id="note" hidden></span></p>
    <div class="btns">
      <button class="btn" id="back" type="button" aria-label="Back one step">←</button>
      <button class="btn" id="play" type="button">▶ Play</button>
      <button class="btn go" id="next" type="button">Next step</button>
    </div>
  </div>
</main>

<script>
const LESSONS = [{ code: "5-7", name: "Sharing to Divide", problems: [
  { n: 334, d: 4, est: "320 ÷ 4 = 80", good: true,  note: "Your sheet says 83 R2. That matches. Nice work!" },
  { n: 148, d: 6, est: "150 ÷ 6 = 25", good: true,  note: "Your sheet says 24 R4. That matches. Nice work!" },
  { n: 948, d: 7, est: "980 ÷ 7 = 140", good: true, note: "Your sheet says 135 R3. That matches. Nice work!" },
  { n: 179, d: 4, est: "160 ÷ 4 = 40", good: false, note: "Your sheet looks like it says 19. Fix this one: the answer starts with 4 tens." },
  { n: 125, d: 5, est: "100 ÷ 5 = 20", good: true,  note: "Your sheet says 25. That matches. Nice work!" },
  { n: 418, d: 8, est: "400 ÷ 8 = 50", good: true,  note: "Your sheet says 52 R2. That matches. Nice work!" },
  { n: 587, d: 2, est: "600 ÷ 2 = 300", good: false, note: "Your sheet says 293 R but the remainder number is missing. Write R1." },
  { n: 747, d: 8, est: "720 ÷ 8 = 90", good: true,  note: "Your sheet says 93 R3. That matches. Nice work!" }
] }, { code: "5-10", name: "Estimate Quotients", problems: [
  { type: "est", n: 215,  d: 43, method: "round",  D: 40, N: 200,  lo: 200,  hi: 300,  good: false, note: "Your sheet says 50. Check it: 40 × 50 = 2,000, way more than 200. The estimate is 5." },
  { type: "est", n: 6105, d: 29, method: "round",  D: 30, N: 6000, lo: 6000, hi: 7000, good: true,  note: "Your sheet says 6,000 ÷ 30 = 200. That matches. Nice work!" },
  { type: "est", n: 4216, d: 53, method: "round",  D: 50, N: 4000, lo: 4000, hi: 5000, good: true,  note: "Your sheet says 4,000 ÷ 50 = 80. That matches. Nice work!" },
  { type: "est", n: 549,  d: 62, method: "compat", D: 60, N: 540,  good: true,  note: "Your sheet says 540 ÷ 60 = 9. That matches. Nice work!" },
  { type: "est", n: 2359, d: 81, method: "compat", D: 80, N: 2400, good: true,  note: "Your sheet says 2,400 ÷ 80 = 30. That matches. Nice work!" },
  { type: "est", n: 6391, d: 74, method: "compat", D: 70, N: 6300, good: false, note: "Your sheet has 6,300 ÷ 70 but the answer looks like 70. 70 × 90 = 6,300, so the estimate is 90." },
  { type: "est", n: 488,  d: 92, method: "compat", D: 90, N: 450,  good: true,  note: "Your sheet says 450 ÷ 90 = 5. That matches. Nice work!" },
  { type: "est", n: 321,  d: 39, method: "compat", D: 40, N: 320,  good: true,  note: "Your sheet says 320 ÷ 40 = 8. That matches. Nice work!" },
  { type: "est", n: 7901, d: 43, method: "compat", D: 40, N: 8000, good: false, note: "Your sheet says 2,000. Check it: 40 × 2,000 = 80,000. Too big! The estimate is 200." },
  { type: "est", n: 4216, d: 81, method: "compat", D: 80, N: 4000, good: false, note: "Your sheet looks like it used 4,200 ÷ 70 = 60. 81 is closer to 80 than to 70, so 4,000 ÷ 80 = 50 is a closer estimate." }
] }];
let li = 0, PROBLEMS = LESSONS[0].problems;
const fmt = x => x.toLocaleString("en-US");
const PLACE = ["hundreds", "tens", "ones"], ONE = ["hundred", "ten", "one"];
const KIND_COLOR = ["green", "red", "blue"]; // hundreds squares, tens sticks, ones dots
const unit = (n, i) => n + " " + (n === 1 ? ONE[i] : PLACE[i]);
const NS = "http://www.w3.org/2000/svg";
const $ = id => document.getElementById(id);
const f = x => x.toFixed(1);
const mk = (tag, attrs) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; };
const narrow = matchMedia("(max-width: 620px)");
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

function build(p, tall) {
  const svg = $("board");
  svg.textContent = "";
  const defs = mk("defs", {});
  svg.append(defs);
  const items = [], caps = [];
  let step = -1, seed = p.n * 31 + p.d;
  const rnd = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
  const j = a => (rnd() - .5) * 2 * a;
  const begin = (label, text) => { step++; caps.push({ label, text }); };

  function T(x, y, str, o = {}) {
    const el = mk("text", { x: f(x), y: f(y), "font-size": o.size || 30, "text-anchor": o.anchor || "start", class: "t " + (o.color || "ink") });
    el.textContent = str;
    svg.append(el);
    const b = el.getBBox(), id = "cp" + items.length;
    const cp = mk("clipPath", { id }), r = mk("rect", { x: f(b.x - 6), y: f(b.y - 8), width: 0, height: f(b.height + 16) });
    cp.append(r); defs.append(cp);
    el.setAttribute("clip-path", `url(#${id})`);
    const it = { el, r, b, step, kind: "t", chars: str.length, dur: Math.max(230, str.length * (o.rate || 75)), gap: 90, color: o.color || "ink" };
    items.push(it);
    return it;
  }
  function S(d, o = {}) {
    const el = mk("path", { d, pathLength: 1, class: "s " + (o.color || "ink"), "stroke-width": o.w || 3 });
    svg.append(el);
    const it = { el, step, kind: "s", len: el.getTotalLength(), dur: o.dur || 260, gap: o.gap == null ? 80 : o.gap, color: o.color || "ink" };
    items.push(it);
    return it;
  }
  const line = (x1, y1, x2, y2) => `M${f(x1)} ${f(y1)} Q${f((x1 + x2) / 2 + j(2))} ${f((y1 + y2) / 2 + j(2))} ${f(x2)} ${f(y2)}`;
  const box = (x, y, w, h) => `M${f(x + j(2))} ${f(y + j(2))} L${f(x + w + j(2))} ${f(y + j(2))} L${f(x + w + j(2))} ${f(y + h + j(2))} L${f(x + j(2))} ${f(y + h + j(2))} Z`;
  const ring = (cx, cy, r) => `M${f(cx - r)} ${f(cy)} A${r} ${r} 0 1 1 ${f(cx + r)} ${f(cy)} A${r} ${r} 0 1 1 ${f(cx - r)} ${f(cy + .6)}`;

  const ell = (cx, cy, rx, ry) => `M${f(cx - rx)} ${f(cy)} A${f(rx)} ${f(ry)} 0 1 1 ${f(cx + rx)} ${f(cy)} A${f(rx)} ${f(ry)} 0 1 1 ${f(cx - rx)} ${f(cy + .6)}`;
  const tick = (x, y) => S(`M${f(x)} ${y - 9} L${f(x + 8)} ${y} L${f(x + 22)} ${y - 22}`, { color: "green", dur: 260 });
  const fin = (w, h) => {
    svg.setAttribute("viewBox", `0 0 ${w} ${Math.ceil(h)}`);
    svg.setAttribute("aria-label", `Whiteboard working out ${fmt(p.n)} divided by ${p.d}`);
    const pen = mk("g", { id: "pen", visibility: "hidden" });
    pen.append(mk("path", { d: "M0 0 L4 -11 L12 -6 Z", class: "tip ink" }), mk("path", { d: "M4 -11 L12 -6 L40 -50 L32 -55 Z", class: "body" }));
    svg.append(pen);
    return { items, caps, pen };
  };
  if (p.type === "est") return buildEst();

  function buildEst() { // lesson 5-10: swap in easy numbers, then divide
    const { n, d, D: dv, N: nv } = p, q = nv / dv, round = p.method === "round";
    const Wd = tall ? 460 : 800, x0 = tall ? 16 : 40, yT = tall ? 58 : 62;
    const yA = tall ? 172 : 160, yB = yA + 95, yF = yB + 52;
    const A = tall ? { x: 20, y: yF + 30, w: 420 } : { x: 440, y: 120, w: 330 };
    const xa = x0 + 62, xm = x0 + 150, xd = x0 + 215, xe = x0 + 280, xq = x0 + 345;
    const big = (x, y, str, color) => T(x, y, String(str), { size: 44, anchor: "middle", color, rate: 110 });
    const arrow = (x, y1, y2) => S(`M${x} ${y1} L${f(x + j(1.5))} ${y2} M${x - 6} ${y2 - 8} L${x} ${y2} L${x + 6} ${y2 - 8}`, { color: "red", w: 2.2, dur: 380 });
    function numberLine(y, lo, hi, v) {
      const x1 = A.x + 26, x2 = A.x + A.w - 26, xv = x1 + (x2 - x1) * (v - lo) / (hi - lo);
      const near = v - lo <= hi - v ? lo : hi, xp = near === lo ? x1 : x2, dir = xp < xv ? 1 : -1;
      S(line(x1, y, x2, y), { dur: 380 });
      S(line(x1, y - 8, x1, y + 8), { dur: 90 });
      S(line((x1 + x2) / 2, y - 5, (x1 + x2) / 2, y + 5), { dur: 70, w: 2 });
      S(line(x2, y - 8, x2, y + 8), { dur: 90 });
      T(x1, y + 32, fmt(lo), { size: 23, anchor: "middle" });
      T(x2, y + 32, fmt(hi), { size: 23, anchor: "middle" });
      S(ring(xv, y, 4.5), { color: "red", dur: 140 });
      T(xv, y - 13, fmt(v), { size: 24, anchor: "middle", color: "red" });
      S(`M${f(xv)} ${y - 40} Q${f((xv + xp) / 2)} ${y - 66} ${f(xp)} ${y - 12} M${f(xp + dir * 10)} ${y - 14} L${f(xp)} ${y - 12} L${f(xp + dir * 3)} ${y - 23}`, { color: "blue", dur: 420, w: 2.4 });
      S(ell(xp, y + 24, 15 + fmt(near).length * 5, 15), { color: "blue", dur: 320, w: 2.4 });
    }

    begin("Set up", `We only need a close answer, so swap in numbers that are easy to divide in your head. ${round ? "This one uses rounding." : "This one uses compatible numbers."}`);
    const tt = T(x0, yT, `${fmt(n)} ÷ ${d} is about ?`, { size: 40 });
    S(line(tt.b.x, yT + 11, tt.b.x + tt.b.width, yT + 12), { color: "red", dur: 320 });
    const tag = round ? "round both numbers" : "use compatible numbers";
    if (tall) T(x0, yT + 36, tag, { size: 24, color: "green" });
    else T(Wd - 30, yT - 2, tag, { size: 24, color: "green", anchor: "end" });
    big(xa, yA, fmt(n)); big(xm, yA, "÷"); big(xd, yA, d);

    const dlo = Math.floor(d / 10) * 10;
    begin("Divisor", `${d} is between ${dlo} and ${dlo + 10}. It is closer to ${dv}, and ${dv} is much easier to divide by.`);
    numberLine(A.y + 72, dlo, dlo + 10, d);
    arrow(xd, yA + 14, yB - 44);
    const dT = big(xd, yB, dv, "blue");

    if (round) {
      begin("Dividend", `${fmt(n)} is between ${fmt(p.lo)} and ${fmt(p.hi)}. It is closer to ${fmt(nv)}.`);
      numberLine(A.y + 222, p.lo, p.hi, n);
    } else {
      begin("Dividend", `Now find a number near ${fmt(n)} that ${dv} divides evenly. ${dv} × ${fmt(q)} = ${fmt(nv)} is the closest.`);
      const stepSize = 10 ** Math.floor(Math.log10(q) + 1e-9);
      T(A.x + 6, A.y + 162, `${dv} × ? is close to ${fmt(n)}`, { size: 23, color: "blue" });
      let k = 0, pick = null;
      [q - stepSize, q, q + stepSize].filter(m => m > 0).forEach(m => {
        const it = T(A.x + 34, A.y + 200 + k++ * 34, `${dv} × ${fmt(m)} = ${fmt(dv * m)}`, { size: 26 });
        if (m === q) pick = it;
      });
      S(ell(pick.b.x + pick.b.width / 2, pick.b.y + pick.b.height / 2, pick.b.width / 2 + 14, pick.b.height / 2 + 1), { color: "red", dur: 420, w: 2.4 });
    }
    arrow(xa, yA + 14, yB - 44);
    const nT = big(xa, yB, fmt(nv), "blue");
    big(xm, yB, "÷");

    const n1 = nv / 10, d1 = dv / 10;
    let lead = n1;
    while (lead % 10 === 0 && (lead / 10) % d1 === 0) lead /= 10;
    const fact = lead === n1 ? `${n1} ÷ ${d1} = ${q}` : `${lead} ÷ ${d1} = ${lead / d1}, so ${fmt(n1)} ÷ ${d1} = ${fmt(q)}`;
    begin("Divide", `Cross off one zero from each number: ${fmt(nv)} ÷ ${dv} is the same as ${fmt(n1)} ÷ ${d1}. ${fact}.`);
    [nT, dT].forEach(it => {
      const x = it.b.x + it.b.width - it.b.width / it.chars / 2;
      S(`M${f(x - 8)} ${yB + 3} L${f(x + 8)} ${yB - 31}`, { color: "red", dur: 170 });
    });
    T(x0 + 8, yF, fact, { size: 27 });
    big(xe, yB, "="); big(xq, yB, fmt(q), "green");

    const said = `${fmt(n)} ÷ ${d} is about ${fmt(q)}`;
    begin("Answer", `${said.replace(/ /g, "\u00a0")}. Multiply to check: ${dv} × ${fmt(q)} = ${fmt(nv)}, which is close to ${fmt(n)}.`);
    const yAns = tall ? A.y + 330 : yF + 82;
    const ans = T(x0, yAns, said, { size: 36, color: "blue" });
    S(line(ans.b.x, yAns + 11, ans.b.x + ans.b.width, yAns + 12), { color: "red", dur: 320 });
    const chk = T(x0, yAns + 42, `check: ${dv} × ${fmt(q)} = ${fmt(nv)}`, { size: 25, color: "green" });
    tick(chk.b.x + chk.b.width + 12, yAns + 42);
    return fin(Wd, Math.max(yAns + 66, tall ? 0 : A.y + 300));
  }

  const ds = String(p.n).split("").map(Number), n = ds.length, d = p.d;
  const Q = Math.floor(p.n / d), R = p.n % d, hasH = Q >= 100;
  const CS = 46, C = 2, rowsN = 2 + 2 * String(Q).length;

  // Where things live on the board
  const W = tall ? 460 : 800;
  const title = tall ? { x: 20, y: 58 } : { x: 40, y: 62 };
  const div = tall ? { x: 14, y: 108 } : { x: 34, y: 95 };
  const divBottom = div.y + rowsN * CS;
  const G = tall ? { x: 20, y: divBottom + 44, w: 420 } : { x: 410, y: 122, w: 360 };
  const cx = c => div.x + c * CS + CS / 2, by = r => div.y + r * CS + 36;
  const D = (r, c, ch, color) => T(cx(c), by(r), String(ch), { size: 40, anchor: "middle", color, rate: 230 });

  const gRows = d > 4 ? 2 : 1, gCols = Math.ceil(d / gRows), gGap = 8;
  const gw = (G.w - (gCols - 1) * gGap) / gCols, gh = gRows === 1 ? 170 : 125;
  const gx = g => G.x + (g % gCols) * (gw + gGap), gy = g => G.y + 14 + Math.floor(g / gCols) * (gh + gGap);
  let noteY = G.y + 14 + gRows * gh + (gRows - 1) * gGap + 36;
  const note = (str, color) => { const it = T(G.x, noteY, str, { size: 23, color }); noteY += 33; return it; };

  function deal(i, q) { // hand out q blocks of place i to every group, one round at a time
    const made = [];
    const stickGap = Math.min(11, (gw - 20) / 9), dotGap = Math.min(12, (gw - 26) / 8);
    for (let k = 0; k < q; k++) for (let g = 0; g < d; g++) {
      const x = gx(g), y = gy(g), top = y + (hasH ? 42 : 12), o = { color: KIND_COLOR[i], gap: 12, w: 2.6 };
      if (i === 0) made.push(S(box(x + 10 + k * 28, y + 10, 22, 22), { ...o, dur: 170 }));
      else if (i === 1) made.push(S(line(x + 11 + k * stickGap + j(1.2), top, x + 11 + k * stickGap + j(1.2), top + 34), { ...o, dur: 80 }));
      else made.push(S(ring(x + 14 + k * dotGap, top + 48, 3.6), { ...o, dur: 80 }));
    }
    const total = made.reduce((a, m) => a + m.dur + m.gap, 0);
    if (total > 3600) made.forEach(m => { m.dur *= 3600 / total; m.gap *= 3600 / total; });
  }

  // Step 1: set up the board
  begin("Set up", `Share ${p.n} into ${d} equal groups. Each box is one group. A quick estimate, ${p.est}, says the answer should be near ${p.est.split("= ")[1]}.`);
  const tt = T(title.x, title.y, `${p.n} ÷ ${d} = ?`, { size: 46 });
  S(line(tt.b.x, title.y + 11, tt.b.x + tt.b.width, title.y + 12), { color: "red", dur: 320 });
  if (tall) T(title.x, title.y + 36, "estimate: " + p.est, { size: 24, color: "green" });
  else T(W - 30, title.y - 2, "estimate: " + p.est, { size: 24, color: "green", anchor: "end" });
  D(1, 0, d);
  const xb = div.x + C * CS - 3, yt = div.y + CS + 3;
  S(`M${xb - 5} ${yt + CS - 5} Q${xb + 12} ${f(yt + CS / 2)} ${xb} ${yt} L${div.x + (C + n) * CS + 2} ${f(yt + j(2))}`, { dur: 480 });
  ds.forEach((x, i) => D(1, C + i, x));
  T(G.x + G.w / 2, G.y, `${d} equal groups`, { size: 25, color: "blue", anchor: "middle" });
  for (let g = 0; g < d; g++) S(box(gx(g), gy(g), gw, gh), { color: "blue", dur: 300, w: 2.4 });

  // The division itself
  let cur = 0, started = false, row = 2, curRow = 1, prev = 0;
  for (let i = 0; i < n; i++) {
    cur = cur * 10 + ds[i];
    if (started) {
      begin("Bring down", prev
        ? `Trade the ${unit(prev, i - 1)} for ${prev * 10} ${PLACE[i]} and bring down the ${ds[i]}. Now there are ${unit(cur, i)} to share.`
        : `Nothing to trade. Bring down the ${ds[i]}. Now there are ${unit(cur, i)} to share.`);
      const ax = cx(C + i), y1 = by(1) + 14, y2 = by(curRow) - 36;
      S(`M${f(ax)} ${y1} L${f(ax + j(1.5))} ${y2} M${f(ax - 6)} ${y2 - 8} L${f(ax)} ${y2} L${f(ax + 6)} ${y2 - 8}`, { color: "red", w: 2.2, dur: 420 });
      D(curRow, C + i, ds[i]);
      note(prev ? `${unit(prev, i - 1)} = ${prev * 10} ${PLACE[i]}.  ${prev * 10} + ${ds[i]} = ${cur} ${PLACE[i]}` : `0 ${PLACE[i - 1]} left. Bring down ${unit(ds[i], i)}`);
    }
    if (!started && cur < d && i < n - 1) {
      const nxt = cur * 10 + ds[i + 1];
      begin("Trade", `${unit(cur, i)} can't give every group one. Trade them for ${cur * 10} ${PLACE[i + 1]}. With the ${ds[i + 1]} ${PLACE[i + 1]} we already have, that makes ${nxt} ${PLACE[i + 1]}.`);
      S(`M${f(cx(C + i) - 15)} ${by(1) + 6} Q${f((cx(C + i) + cx(C + i + 1)) / 2)} ${by(1) + 15} ${f(cx(C + i + 1) + 15)} ${by(1) + 6}`, { color: "blue", dur: 320 });
      note(`${unit(cur, i)} = ${cur * 10} ${PLACE[i + 1]}.  ${cur * 10} + ${ds[i + 1]} = ${nxt} ${PLACE[i + 1]}`);
      continue;
    }
    started = true;
    const q = Math.floor(cur / d), prod = q * d, rem = cur - prod, ps = String(prod);
    begin("Share the " + PLACE[i], `Share ${unit(cur, i)}: ${d} × ${q} = ${prod} is as close as we can get without going over. Every group gets ${unit(q, i)}.`);
    D(0, C + i, q, "blue");
    deal(i, q);

    begin("Subtract", `We handed out ${unit(prod, i)}. ${cur} − ${prod} = ${rem}. That leaves ${rem ? unit(rem, i) : "nothing"}.`);
    const mx = cx(C + i - ps.length);
    S(line(mx - 9, by(row) - 13, mx + 9, by(row) - 13), { dur: 150 });
    ps.split("").forEach((ch, k) => D(row, C + i - ps.length + 1 + k, ch));
    S(line(mx - 16, by(row) + 9, cx(C + i) + 18, by(row) + 9 + j(1.5)), { dur: 300 });
    D(row + 1, C + i, rem);
    curRow = row + 1; row += 2; prev = rem; cur = rem;
  }

  // Last step: remainder, answer, check
  const answer = `${p.n} ÷ ${d} = ${Q}` + (R ? ` R${R}` : "");
  const said = answer.replace(/ /g, "\u00a0");
  begin("Answer", R
    ? `${unit(R, n - 1)} can't be shared fairly among ${d} groups, so that is the remainder. ${said}. Multiply back to check.`
    : `Nothing is left over, so there is no remainder. ${said}. Multiply back to check.`);
  if (R) {
    T(div.x + (C + n) * CS + 6, by(0), "R" + R, { size: 36, color: "red" });
    const lo = T(G.x, noteY, "left over:", { size: 23, color: "red" });
    for (let k = 0; k < R; k++) S(ring(lo.b.x + lo.b.width + 18 + k * 15, noteY - 8, 3.6), { color: "red", dur: 90, gap: 30, w: 2.6 });
    noteY += 33;
  } else note("nothing left over!", "green");
  const takeY = tall ? noteY + 40 : divBottom + 62;
  const ans = T(title.x, takeY, answer, { size: 44, color: "blue" });
  S(line(ans.b.x, takeY + 11, ans.b.x + ans.b.width, takeY + 12), { color: "red", dur: 320 });
  let chk = T(title.x, takeY + 44, `check: ${d} × ${Q} = ${d * Q}`, { size: 25, color: "green" }), chkY = takeY + 44;
  if (R) { chkY += 31; chk = T(title.x, chkY, `${d * Q} + ${R} = ${p.n}`, { size: 25, color: "green" }); }
  const kx = chk.b.x + chk.b.width + 12;
  S(`M${f(kx)} ${chkY - 9} L${f(kx + 8)} ${chkY} L${f(kx + 22)} ${chkY - 22}`, { color: "green", dur: 260 });

  return fin(W, Math.max(chkY + 24, tall ? 0 : noteY));
}

const done = new Set();
let pi = 0, si = 0, model = null, raf = 0, wait = 0, running = false, auto = false, liveItems = [];

LESSONS.forEach((l, i) => {
  const b = document.createElement("button");
  b.className = "lesson"; b.type = "button"; b.textContent = `${l.code}  ${l.name}`;
  b.onclick = () => { auto = false; setLesson(i); };
  $("lessons").appendChild(b);
});
function setLesson(i) {
  li = i; PROBLEMS = LESSONS[i].problems;
  $("eyebrow").textContent = "Additional Practice " + LESSONS[i].code;
  $("lessonName").textContent = LESSONS[i].name;
  [...$("lessons").children].forEach((b, k) => b.setAttribute("aria-current", k === i));
  $("chips").textContent = "";
  PROBLEMS.forEach((p, k) => {
    const b = document.createElement("button");
    b.className = "chip"; b.type = "button"; b.textContent = `${k + 1}.  ${fmt(p.n)} ÷ ${p.d}`;
    b.onclick = () => { auto = false; open(k, 0, true); };
    $("chips").appendChild(b);
  });
  open(0, 0, true);
}

function setP(it, p) {
  it.el.style.visibility = p > 0 ? "visible" : "hidden";
  if (it.kind === "t") it.r.setAttribute("width", f(p >= 1 ? it.b.width + 40 : (it.b.width + 8) * p));
  else it.el.style.strokeDashoffset = 1 - p;
}

function open(i, s, animate) {
  pi = i; si = s;
  model = build(PROBLEMS[i], narrow.matches);
  [...$("chips").children].forEach((c, k) => {
    c.setAttribute("aria-current", k === i);
    c.classList.toggle("done", done.has(li + "-" + k));
  });
  show(animate);
}

function show(animate) {
  cancelAnimationFrame(raf); clearTimeout(wait);
  const last = si === model.caps.length - 1, cap = model.caps[si];
  liveItems = [];
  model.items.forEach(it => {
    if (it.step < si) setP(it, 1);
    else if (it.step > si) setP(it, 0);
    else liveItems.push(it);
  });
  $("count").textContent = `Step ${si + 1} of ${model.caps.length} · ${cap.label}`;
  $("say").textContent = cap.text;
  $("note").hidden = true;
  $("back").disabled = si === 0;
  $("next").textContent = !last ? "Next step" : pi < PROBLEMS.length - 1 ? "Next problem" : "Start over";
  $("play").textContent = auto ? "⏸ Pause" : "▶ Play";
  if (!animate || reduce) return finish();

  let acc = 0;
  liveItems.forEach(it => { setP(it, 0); it.t0 = acc; acc += it.dur + it.gap; });
  keepInView();
  running = true;
  const start = performance.now(), tip = model.pen.firstChild;
  const frame = now => {
    const t = now - start;
    let active = null;
    for (const it of liveItems) {
      const p = Math.min(1, Math.max(0, (t - it.t0) / it.dur));
      setP(it, p);
      if (t >= it.t0) active = it;
    }
    if (t >= acc) return finish();
    if (active) {
      const p = Math.min(1, (t - active.t0) / active.dur);
      let x, y;
      if (active.kind === "t") {
        x = active.b.x + active.b.width * p;
        y = active.b.y + active.b.height * (.6 + .16 * Math.sin(p * active.chars * 3.2));
      } else {
        const pt = active.el.getPointAtLength(p * active.len);
        x = pt.x; y = pt.y;
      }
      model.pen.setAttribute("transform", `translate(${f(x)} ${f(y)})`);
      model.pen.setAttribute("visibility", "visible");
      tip.setAttribute("class", "tip " + active.color);
    }
    raf = requestAnimationFrame(frame);
  };
  raf = requestAnimationFrame(frame);
}

function finish() {
  cancelAnimationFrame(raf);
  running = false;
  liveItems.forEach(it => setP(it, 1));
  model.pen.setAttribute("visibility", "hidden");
  const last = si === model.caps.length - 1;
  if (last) {
    const p = PROBLEMS[pi];
    $("note").textContent = p.note;
    $("note").classList.toggle("good", p.good);
    $("note").hidden = false;
    done.add(li + "-" + pi);
    $("chips").children[pi].classList.add("done");
    auto = false;
    $("play").textContent = "▶ Play";
  } else if (auto) {
    wait = setTimeout(() => { si++; show(true); }, 1500 + model.caps[si].text.length * 45);
  }
}

function keepInView() { // on a phone the board is taller than the screen, so follow the marker
  let top = Infinity, bottom = -Infinity;
  liveItems.forEach(it => { const r = it.el.getBoundingClientRect(); top = Math.min(top, r.top); bottom = Math.max(bottom, r.bottom); });
  const limit = document.querySelector(".dock").getBoundingClientRect().top;
  if (top < 8 || bottom > limit - 8) {
    try { window.scrollBy({ top: (top + bottom) / 2 - limit / 2, behavior: reduce ? "auto" : "smooth" }); } catch (e) {}
  }
}

function next() {
  if (running) return finish();
  clearTimeout(wait);
  if (si < model.caps.length - 1) { si++; show(true); }
  else open((pi + 1) % PROBLEMS.length, 0, true);
}
function back() {
  auto = false;
  if (si > 0) { si--; show(false); keepInView(); }
}
function play() {
  auto = !auto;
  clearTimeout(wait);
  $("play").textContent = auto ? "⏸ Pause" : "▶ Play";
  if (!auto || running) return;
  if (si < model.caps.length - 1) { si++; show(true); }
  else { si = 0; show(true); }
}

$("next").onclick = next;
$("back").onclick = back;
$("play").onclick = play;
document.addEventListener("keydown", e => {
  if (e.target.closest("button")) return;
  if (e.key === "ArrowRight") next();
  if (e.key === "ArrowLeft") back();
});
narrow.addEventListener("change", () => open(pi, si, false));

const fontsReady = document.fonts && document.fonts.load ? document.fonts.load('30px "Patrick Hand"') : Promise.resolve();
Promise.race([fontsReady, new Promise(r => setTimeout(r, 1500))]).catch(() => {}).then(() => setLesson(0));
</script>
